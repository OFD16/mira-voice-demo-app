<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.55" stop-color="#B05CE8"/>
      <stop offset="1" stop-color="#FF8A7A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- voice bars that rise into a heart-like crest: talking + wellbeing -->
  <g fill="#ffffff" stroke-linecap="round">
    <rect x="128" y="226" width="36" height="60"  rx="18"/>
    <rect x="182" y="176" width="36" height="160" rx="18"/>
    <rect x="236" y="136" width="40" height="240" rx="20"/>
    <rect x="294" y="176" width="36" height="160" rx="18"/>
    <rect x="348" y="226" width="36" height="60"  rx="18"/>
  </g>
</svg>
